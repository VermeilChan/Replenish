name: "Feature Request"
description: "Suggest something new for Replenish"
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Check [open issues](https://github.com/Mitra-88/ReplenishPlusPlus/issues) first. If someone already asked for this, thumbs-up their issue or add context there.

  - type: markdown
    attributes:
      value: |
        ---
        ### The idea

  - type: textarea
    id: "feature"
    attributes:
      label: "What do you want?"
      description: |
        Describe the feature. Be specific. "Make it better" isn't actionable. "Add a config option to disable replanting while sneaking" is.
      placeholder: |
        Add a toggle so replanting only happens when I'm NOT sneaking.
        Right now I can't break a crop without it immediately going back in the ground,
        which is annoying when I actually want to clear a field.
    validations:
      required: true

  - type: textarea
    id: "why"
    attributes:
      label: "Why?"
      description: |
        What's the actual use case? What are you trying to do that you currently can't? This helps me figure out if the feature solves a real problem or just a hypothetical one.
      placeholder: |
        I run a survival server and players keep complaining they can't
        manually clear crops without the plugin fighting them.
    validations:
      required: true

  - type: textarea
    id: "how"
    attributes:
      label: "How would it work?"
      description: |
        If you've thought about implementation - config keys, command syntax, behavior details. put it here. If not, skip it. I'll figure it out.
      placeholder: |
        Maybe a config key like "replantWhileSneaking: false"
        or a per-player toggle via /replenish sneakmode
    validations:
      required: false

  - type: dropdown
    id: "scope"
    attributes:
      label: "Where does this fit?"
      description: "Helps me gauge how big the change is."
      options:
        - "New config option"
        - "New command or permission"
        - "Change to existing behavior"
        - "New crop / block support"
        - "Something else entirely"
    validations:
      required: true

  - type: dropdown
    id: "testing"
    attributes:
      label: "Would you test a dev build?"
      description: "Not required. But if I build it and you vanish, that's annoying for both of us."
      options:
        - "Yeah, happy to"
        - "Maybe"
        - "No, I just want to suggest it"
    validations:
      required: true

  - type: textarea
    id: "additional-context"
    attributes:
      label: "Anything else"
      description: "Links, screenshots from other plugins doing something similar, mockups. Whatever."
    validations:
      required: false