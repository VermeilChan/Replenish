name: ReplenishPlusPlus
main: dev.replenishplusplus.ReplenishPlusPlus
version: "${project.version}"
api-version: "26.2"
description: "Auto-replant plugin for Paper/Purpur. You break a crop, it goes back in the ground. That's basically it. Stole the idea from Hypixel's Replenish because I got tired of replanting by hand."
authors: [ "Mitra-88" ]
website: "https://github.com/Mitra-88/ReplenishPlusPlus"

permissions:
  replenishplusplus.*:
    description: "Access to all ReplenishPlusPlus permissions."
    default: op
    children:
      replenishplusplus.use: true
      replenishplusplus.toggle: true
      replenishplusplus.reload: true
      replenishplusplus.status: true
      replenishplusplus.version: true

  replenishplusplus.use:
    description: "Allows using /replenishplusplus base command."
    default: true

  replenishplusplus.toggle:
    description: "Allows toggling ReplenishPlusPlus on/off globally."
    default: op

  replenishplusplus.reload:
    description: "Allows reloading ReplenishPlusPlus configuration."
    default: op

  replenishplusplus.status:
    description: "Allows viewing current ReplenishPlusPlus status."
    default: true

  replenishplusplus.version:
    description: "Allows viewing version information."
    default: true
